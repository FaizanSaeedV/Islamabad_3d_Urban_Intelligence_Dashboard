services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: smart_city_twin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: islamabad_twin_local
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_city_twin"]
      interval: 5s
      timeout: 5s
      retries: 30

  loader:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &database_environment
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: smart_city_twin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: islamabad_twin_local
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "scripts/load_to_postgis.py", "--apply-schema"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *database_environment
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      loader:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgis_data:
